[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temporal-literature-review"
version = "0.1.0"
description = "A before/after demonstration of durable literature review orchestration with Temporal"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27,<2",
  "temporalio>=1.30,<2",
]

[project.scripts]
durable-research = "durable_research.agent_cli:main"
durable-research-worker = "durable_research.worker:main"
durable-research-start = "durable_research.starter:main"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/durable_research"]

[tool.pytest.ini_options]
addopts = "--cov=durable_research --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["durable_research"]
omit = [
  "src/durable_research/starter.py",
  "src/durable_research/worker.py",
]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["durable_research"]
