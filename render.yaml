# Render Blueprint — static site for sjarmak.ai
# Deploys from the public GitHub repo, auto-rebuilds on push to main.
services:
  - type: web
    runtime: static
    name: sjarmak-ai
    branch: main
    # Deploy only after GitHub CI (astro check + build) passes — gates broken
    # commits out of production while keeping direct pushes (digest cron) as
    # the deploy trigger. Render skips commits with zero checks; ci.yml runs
    # on every push to main, so digest pushes always carry a check.
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    buildFilter:
      paths:
        - src/**
        - public/**
        - astro.config.mjs
        - tsconfig.json
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /media/*
        name: Cache-Control
        value: public, max-age=604800
    # Single-page-style fallback is NOT needed; Astro emits real 404.html.
