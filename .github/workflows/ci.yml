name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Media guard
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/checks/media-guard.mjs --base "$BASE_SHA" --head "$GITHUB_SHA"
      - run: npm ci
      - run: npm run check
      - run: npm run build
