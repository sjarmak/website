- title: "Towards a Physics Foundation Model"
  url: https://arxiv.org/html/2509.13805v4
  category: Physics AI
  kind: paper
  note: >-
    General Physics Transformer (GPhyT), trained on 1.8TB of simulation data
    across fluid-solid interaction, shock waves, thermal convection, and
    multi-phase dynamics. Claims 7x over specialized architectures and
    in-context generalization to unseen systems without being told the
