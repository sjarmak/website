- title: SqueakyClean
  url: https://squeakyclean.ai/
  category: Agentic coding
  kind: tool
  note: >-
    Opinionated, semi-deterministic codegen: one declarative ProblemSpec in, a
    buildable Clean-Architecture app out. Uses small, pattern-specialized agents
    (a 34-pattern library) instead of one big-context model, and runs in reverse
    to refactor brownfield code onto the dependency rule. Interesting for the
    small-model, architecture-first bet.
  tags: [agentic-coding, codegen, clean-architecture]
  added: 2026-07-24

