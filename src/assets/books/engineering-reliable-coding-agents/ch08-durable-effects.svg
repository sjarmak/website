<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="figtitle-ch08-durable-effects" class="bookfig">
<title id="figtitle-ch08-durable-effects">A first attempt records a durable intent and operation identity before an external commit. If the worker dies before recording completion, a replacement reads the pending intent and retries with the same identity; the external boundary must return the prior result, converge, or force explicit reconciliation.</title>
<style>.bookfig .f-bg{fill:#ffffff}.bookfig .s-bg{stroke:#ffffff}.bookfig .f-ink{fill:#1a1a1a}.bookfig .s-ink{stroke:#1a1a1a}.bookfig .f-mid{fill:#6b6b6b}.bookfig .s-mid{stroke:#6b6b6b}.bookfig .f-faint{fill:#b8b8b8}.bookfig .s-faint{stroke:#b8b8b8}.bookfig .f-wash{fill:#e2e2e2}.bookfig .s-wash{stroke:#e2e2e2}.bookfig .f-accent{fill:#8f4e1c}.bookfig .s-accent{stroke:#8f4e1c}.bookfig .f-onacc{fill:#ffffff}.bookfig .s-onacc{stroke:#ffffff}@media (prefers-color-scheme:dark){.bookfig .f-bg{fill:#232019}.bookfig .s-bg{stroke:#232019}.bookfig .f-ink{fill:#ede5d6}.bookfig .s-ink{stroke:#ede5d6}.bookfig .f-mid{fill:#9a8f7c}.bookfig .s-mid{stroke:#9a8f7c}.bookfig .f-faint{fill:#5c5346}.bookfig .s-faint{stroke:#5c5346}.bookfig .f-wash{fill:#3d382f}.bookfig .s-wash{stroke:#3d382f}.bookfig .f-accent{fill:#df9d5e}.bookfig .s-accent{stroke:#df9d5e}.bookfig .f-onacc{fill:#232019}.bookfig .s-onacc{stroke:#232019}}:where([data-theme="dark"]) .bookfig .f-bg{fill:#232019}:where([data-theme="dark"]) .bookfig .s-bg{stroke:#232019}:where([data-theme="dark"]) .bookfig .f-ink{fill:#ede5d6}:where([data-theme="dark"]) .bookfig .s-ink{stroke:#ede5d6}:where([data-theme="dark"]) .bookfig .f-mid{fill:#9a8f7c}:where([data-theme="dark"]) .bookfig .s-mid{stroke:#9a8f7c}:where([data-theme="dark"]) .bookfig .f-faint{fill:#5c5346}:where([data-theme="dark"]) .bookfig .s-faint{stroke:#5c5346}:where([data-theme="dark"]) .bookfig .f-wash{fill:#3d382f}:where([data-theme="dark"]) .bookfig .s-wash{stroke:#3d382f}:where([data-theme="dark"]) .bookfig .f-accent{fill:#df9d5e}:where([data-theme="dark"]) .bookfig .s-accent{stroke:#df9d5e}:where([data-theme="dark"]) .bookfig .f-onacc{fill:#232019}:where([data-theme="dark"]) .bookfig .s-onacc{stroke:#232019}:where([data-theme="light"]) .bookfig .f-bg{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-bg{stroke:#ffffff}:where([data-theme="light"]) .bookfig .f-ink{fill:#1a1a1a}:where([data-theme="light"]) .bookfig .s-ink{stroke:#1a1a1a}:where([data-theme="light"]) .bookfig .f-mid{fill:#6b6b6b}:where([data-theme="light"]) .bookfig .s-mid{stroke:#6b6b6b}:where([data-theme="light"]) .bookfig .f-faint{fill:#b8b8b8}:where([data-theme="light"]) .bookfig .s-faint{stroke:#b8b8b8}:where([data-theme="light"]) .bookfig .f-wash{fill:#e2e2e2}:where([data-theme="light"]) .bookfig .s-wash{stroke:#e2e2e2}:where([data-theme="light"]) .bookfig .f-accent{fill:#8f4e1c}:where([data-theme="light"]) .bookfig .s-accent{stroke:#8f4e1c}:where([data-theme="light"]) .bookfig .f-onacc{fill:#ffffff}:where([data-theme="light"]) .bookfig .s-onacc{stroke:#ffffff}</style>
<rect class="f-bg" width="720" height="360"/>

<text class="f-mid" x="88" y="94" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end">first attempt</text>
<line class="s-faint" x1="100" y1="90" x2="650" y2="90" stroke-width="2"/>
<line class="s-accent" x1="430" y1="52" x2="650" y2="52" stroke-width="1.4"/>
<line class="s-accent" x1="430" y1="52" x2="430" y2="60" stroke-width="1.4"/>
<line class="s-accent" x1="650" y1="52" x2="650" y2="60" stroke-width="1.4"/>
<polygon class="f-mid" points="246,83 258,90 246,97"/>
<polygon class="f-mid" points="405,83 417,90 405,97"/>
<polygon class="f-accent" points="497,83 509,90 497,97"/>
<polygon class="f-faint" points="626,83 638,90 626,97"/>

<circle class="f-mid" cx="100" cy="90" r="7"/>
<circle class="f-mid" cx="270" cy="90" r="7"/>
<circle class="f-accent" cx="430" cy="90" r="8"/>
<circle class="f-accent" cx="520" cy="90" r="6"/>
<circle class="f-bg s-mid" cx="650" cy="90" r="7" stroke-width="1.5"/>

<text class="f-accent" x="540" y="36" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">execute-then-log gap</text>
<text class="f-ink" x="100" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">record intent</text>
<text class="f-mid" x="100" y="137" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle">operation ID 42</text>
<text class="f-ink" x="270" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">dispatch ID 42</text>
<text class="f-accent" x="430" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">external commit</text>
<text class="f-accent" x="520" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">worker dies</text>
<text class="f-ink" x="650" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">completion record</text>
<text class="f-accent" x="650" y="137" font-family="Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle">missing</text>

<!-- Recovery begins from the durable pending intent, not from worker memory. -->
<path class="s-accent" d="M520 128 L520 170 L100 170 L100 215" fill="none" stroke-width="1.4" stroke-dasharray="5 5"/>
<polygon class="f-accent" points="93,207 100,219 107,207"/>
<text class="f-accent" x="310" y="163" font-family="Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">restart reads the durable pending intent</text>

<text class="f-mid" x="88" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end">recovery</text>
<line class="s-faint" x1="100" y1="235" x2="500" y2="235" stroke-width="2"/>
<polygon class="f-mid" points="276,228 288,235 276,242"/>
<polygon class="f-mid" points="475,228 487,235 475,242"/>
<circle class="f-accent" cx="100" cy="235" r="7"/>
<circle class="f-mid" cx="300" cy="235" r="7"/>
<circle class="f-accent" cx="500" cy="235" r="8"/>

<text class="f-accent" x="100" y="266" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">pending ID 42</text>
<text class="f-ink" x="300" y="266" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">retry ID 42</text>
<text class="f-accent" x="500" y="266" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">external boundary</text>
<text class="f-ink" x="700" y="291" font-family="Helvetica, Arial, sans-serif" font-size="10.8" text-anchor="end">same key: return the prior result or converge</text>
<text class="f-mid" x="700" y="309" font-family="Helvetica, Arial, sans-serif" font-size="10.8" text-anchor="end">no safe key: stop, reconcile, or compensate</text>

<text class="f-ink" x="360" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Durable intent survives the worker; the external contract resolves what history cannot know</text>
</svg>
