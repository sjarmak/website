<text class="f-mid" x="600" y="173" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">reconcile_required</text>

<text class="f-mid" x="30" y="230" font-family="Helvetica, Arial, sans-serif" font-size="12">attempt lifecycle (within one epoch)</text>
